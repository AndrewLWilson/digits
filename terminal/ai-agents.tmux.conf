# Digits: optional lines for your own ~/.tmux.conf. The ai-agents launcher does
# not need them; they make the dashboard follow sessions created elsewhere.

# Mouse support everywhere, and let Copilot CLI image previews reach Ghostty.
set -g mouse on
set -g allow-passthrough on

# Apply the dashboard whenever a session named ai-agents is created...
set-hook -g 'session-created[50]' {
  if -F '#{==:#{session_name},ai-agents}' { source-file ~/.tmux/ai-agents.conf }
}

# ...and now, if it already exists.
if -F '#{S:#{?#{==:#{session_name},ai-agents},1,}}' { source-file ~/.tmux/ai-agents.conf }
