# Digits: tmux key bindings paired with terminal/ghostty-keybindings.conf.
#
# Copy to ~/.tmux/ai-agents-shortcuts.conf and add this line to ~/.tmux.conf:
#   source-file ~/.tmux/ai-agents-shortcuts.conf
#
# Ghostty sends ESC [ 5 ; <31001+k> ~ for each shortcut; tmux recognises the
# sequences as User180 ... User194. Each binding only acts when the current
# session is the managed ai-agents session; anywhere else the key does
# nothing. Other keys and existing bindings are unaffected.

# Cmd+1
set -s user-keys[180] "\e[5;31001~"
bind -n User180 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=1 }

# Cmd+2
set -s user-keys[181] "\e[5;31002~"
bind -n User181 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=2 }

# Cmd+3
set -s user-keys[182] "\e[5;31003~"
bind -n User182 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=3 }

# Cmd+4
set -s user-keys[183] "\e[5;31004~"
bind -n User183 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=4 }

# Cmd+5
set -s user-keys[184] "\e[5;31005~"
bind -n User184 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=5 }

# Cmd+6
set -s user-keys[185] "\e[5;31006~"
bind -n User185 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=6 }

# Cmd+7
set -s user-keys[186] "\e[5;31007~"
bind -n User186 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=7 }

# Cmd+8
set -s user-keys[187] "\e[5;31008~"
bind -n User187 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=8 }

# Cmd+9
set -s user-keys[188] "\e[5;31009~"
bind -n User188 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=9 }

# Cmd+0
set -s user-keys[189] "\e[5;31010~"
bind -n User189 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { select-window -t :=10 }

# Cmd+Shift+]
set -s user-keys[190] "\e[5;31011~"
bind -n User190 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { next-window }

# Cmd+Shift+[
set -s user-keys[191] "\e[5;31012~"
bind -n User191 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { previous-window }

# Cmd+;
set -s user-keys[192] "\e[5;31013~"
bind -n User192 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { last-window }

# Cmd+`
set -s user-keys[193] "\e[5;31014~"
bind -n User193 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { run-shell 'exec "$HOME/.local/bin/ai-agents" --next-attention' }

# Cmd+Shift+M
set -s user-keys[194] "\e[5;31015~"
bind -n User194 if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{@ai-agents-managed},1}}' { run-shell 'exec "$HOME/.local/bin/ai-agents" --markdown "#{pane_id}" --client "#{client_name}"' }
