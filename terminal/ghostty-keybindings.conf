# Digits: Ghostty key bindings for the ai-agents tmux workbench.
# Each Command shortcut sends a private escape sequence that
# terminal/ai-agents-shortcuts.tmux.conf maps to a tmux action. These replace
# Ghostty's tab shortcuts, its Cmd+0 font-size reset and macOS Cmd+` window cycling.

# Let Cmd+Enter reach the terminal application.
keybind = cmd+enter=unbind

keybind = cmd+1=csi:5;31001~
keybind = cmd+2=csi:5;31002~
keybind = cmd+3=csi:5;31003~
keybind = cmd+4=csi:5;31004~
keybind = cmd+5=csi:5;31005~
keybind = cmd+6=csi:5;31006~
keybind = cmd+7=csi:5;31007~
keybind = cmd+8=csi:5;31008~
keybind = cmd+9=csi:5;31009~
keybind = cmd+0=csi:5;31010~
keybind = cmd+shift+bracket_right=csi:5;31011~
keybind = cmd+shift+bracket_left=csi:5;31012~
keybind = cmd+semicolon=csi:5;31013~
keybind = cmd+backquote=csi:5;31014~
keybind = cmd+shift+m=csi:5;31015~
